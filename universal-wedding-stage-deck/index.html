<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="theme-color" content="#070b19" />

    <!-- Per-device theme (TODO 27). Runs before paint so the canvas never
         flashes the wrong theme. Explicit toggle wins over prefers-color-scheme. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('wzsd:v1:theme');
          var stored = raw ? JSON.parse(raw) : null;
          var theme =
            stored && (stored.theme === 'day' || stored.theme === 'night')
              ? stored.theme
              : null;
          if (!theme) {
            theme =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'day'
                : 'night';
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme === 'day' ? 'light' : 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'day' ? '#eef2f7' : '#070b19');
        } catch (error) {
          document.documentElement.dataset.theme = 'night';
        }
      })();
    </script>

    <!-- Mobile & Tablet Viewport Lockdown (Prevents unwanted pinch zoom on stage) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Universal Wedding Stage Deck</title>

    <!-- Google Fonts: Montserrat (Headings) & Lora (Body Text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
