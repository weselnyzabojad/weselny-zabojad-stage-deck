<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Universal Wedding Stage Deck</title>
  <desc id="desc">Two interlocking wedding rings on a night-blue stage backdrop</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1430"/>
      <stop offset="1" stop-color="#070b19"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6a6"/>
      <stop offset="0.45" stop-color="#e8b75a"/>
      <stop offset="1" stop-color="#b6812f"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b98bff"/>
      <stop offset="1" stop-color="#7a3cf0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.58">
      <stop offset="0" stop-color="#2b3d7a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#070b19" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <circle cx="206" cy="288" r="94" fill="none" stroke="url(#gold)" stroke-width="26" opacity="0.28" filter="url(#soft)"/>
  <circle cx="306" cy="288" r="94" fill="none" stroke="url(#violet)" stroke-width="26" opacity="0.25" filter="url(#soft)"/>

  <circle cx="206" cy="288" r="90" fill="none" stroke="url(#gold)" stroke-width="24"/>
  <circle cx="306" cy="288" r="90" fill="none" stroke="url(#violet)" stroke-width="24"/>

  <path d="M306 201a90 90 0 0 1 0 174" fill="none" stroke="url(#violet)" stroke-width="24" stroke-linecap="round"/>
  <path d="M206 201a90 90 0 0 0 0 174" fill="none" stroke="url(#gold)" stroke-width="24" stroke-linecap="round"/>

  <path d="M256 92l16 36 36 16-36 16-16 36-16-36-36-16 36-16z" fill="#ffe6a6" opacity="0.95"/>
  <circle cx="352" cy="128" r="7" fill="#b98bff"/>
  <circle cx="160" cy="140" r="5" fill="#ffe6a6" opacity="0.8"/>
</svg>
