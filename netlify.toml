# Netlify configuration for the Universal Wedding Stage Deck PWA.
# The Vite app lives at the repository root, so Netlify builds and publishes
# its `dist` output there.

[build]
  command = "node scripts/deploy-build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers are applied to every response served by Netlify.
#
# The CSP keeps `script-src` limited to same-origin files: Vite emits external
# module scripts, vite-plugin-pwa emits an external `registerSW.js`, and the
# pre-paint theme bootstrap is a plain `public/theme-bootstrap.js`, so no inline
# script allowance is needed.
#
# `connect-src` names the exact production origins:
# - the Supabase project (`https://` for Auth/REST/Edge Functions and `wss://`
#   for Realtime), derived from `VITE_SUPABASE_URL`;
# - the sunset lookup used by the admin Drive import;
# - the Sentry ingest origin from the built-in public DSN (issue #861).
# Update the Supabase host here if the project ref changes; never widen this to
# a wildcard or bare `https:`.
#
# `worker-src` also allows `blob:` because Sentry Session Replay starts its
# compression worker from a Blob URL. Replay is error-only and fully masked.
#
# Netlify resolves matching header rules with the last definition winning, so
# the global rule comes first and the embed-specific rules come after it.
# `/embed/*` and the landing iframe `/extra/banner` are the only paths allowed
# to be framed, and only by the two Weselny Zabojad WordPress origins.
# Everything else keeps `frame-ancestors 'none'`. CSP is the
# single framing authority: no X-Frame-Options header is set, because it cannot
# express a path-specific allowlist and would override the embed policy in
# older browsers.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://qdcuxefperykmjlirufe.supabase.co wss://qdcuxefperykmjlirufe.supabase.co https://api.sunrise-sunset.org https://o4512420559716352.ingest.de.sentry.io; manifest-src 'self'; worker-src 'self' blob:; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  # The wildcard also covers `/extra/banner/`: the route accepts the trailing
  # slash and the global rule would otherwise apply `frame-ancestors 'none'`.
  for = "/extra/banner*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://qdcuxefperykmjlirufe.supabase.co wss://qdcuxefperykmjlirufe.supabase.co https://api.sunrise-sunset.org https://o4512420559716352.ingest.de.sentry.io; manifest-src 'self'; worker-src 'self' blob:; frame-src 'none'; frame-ancestors 'self' https://www.weselnyzabojad.pl https://weselnyzabojad.pl; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"


[[headers]]
  for = "/embed/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://qdcuxefperykmjlirufe.supabase.co wss://qdcuxefperykmjlirufe.supabase.co https://api.sunrise-sunset.org https://o4512420559716352.ingest.de.sentry.io; manifest-src 'self'; worker-src 'self' blob:; frame-src 'none'; frame-ancestors 'self' https://www.weselnyzabojad.pl https://weselnyzabojad.pl; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

