name: Validate PR Source Branch

on:
  pull_request:
    branches:
      - master

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR originates from development
        run: |
          echo "PR source branch: ${{ github.head_ref }}"
          echo "PR target branch: ${{ github.base_ref }}"
          
          if [ "${{ github.head_ref }}" != "development" ]; then
            echo "❌ Error: Pull requests to master are only permitted from the 'development' branch."
            echo "Please change your PR base branch to 'development'."
            exit 1
          else
            echo "✅ Success: PR originates from development."
          fi

  production-cors-origin:
    name: Production CORS origin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify production origin only
        run: node scripts/check-production-origin.mjs

      - name: Verify exact ALLOWED_ORIGIN secret
        if: env.SUPABASE_ACCESS_TOKEN != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-production-origin.mjs --exact