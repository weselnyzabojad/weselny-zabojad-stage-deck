name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Schema, fixtures, tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate translations
        run: npm run validate:i18n

      - name: Validate canonical schema example
        run: npm run validate:schema

      - name: Validate all committed fixtures
        run: npm run validate:fixtures

      - name: Run Vitest
        run: npm test

      - name: Validate Google Doc template
        run: npm run validate:template

      - name: Validate Google Doc field map
        run: npm run validate:google-doc-map

      - name: Build production bundle
        run: npm run build
